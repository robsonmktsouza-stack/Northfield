# Exemplo de produção. Não usar sem adaptar host, TLS, PHP-FPM e logs.
# Colocar esta diretiva no contexto http {}, fora de server {}:
# limit_req_zone $binary_remote_addr zone=motor_fiscal_calc:10m rate=10r/m;

server {
    listen 443 ssl http2;
    server_name northfield.exemplo.com.br;
    root /var/www/northfield/public;
    index index.php;

    ssl_certificate /etc/letsencrypt/live/northfield.exemplo.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/northfield.exemplo.com.br/privkey.pem;

    server_tokens off;
    client_max_body_size 16k;
    client_body_buffer_size 16k;

    # Logs de acesso: configurar retenção curta e sanitização na VPS.
    access_log /var/log/nginx/northfield-access.log combined;
    error_log /var/log/nginx/northfield-error.log warn;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;

    location = /api/calcular {
        limit_req zone=motor_fiscal_calc burst=5 nodelay;
        try_files $uri /index.php?$query_string;
    }

    location / {
        try_files $uri /index.php?$query_string;
    }

    location ~ \.php$ {
        # Ajustar o socket para o PHP-FPM 8.4 efetivamente instalado.
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_read_timeout 15s;
        fastcgi_buffering on;
    }

    location ~ /\. { deny all; }
    location ~* \.(?:txt|md|json|sql|bak|log|env|ini)$ { deny all; }
}
