name: Northfield Fiscal Desktop

on:
  push:
    branches: [ main ]
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop-build.yml'
  pull_request:
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop-build.yml'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore desktop/Northfield.Fiscal.Desktop/Northfield.Fiscal.Desktop.csproj

      - name: Build
        run: dotnet build desktop/Northfield.Fiscal.Desktop/Northfield.Fiscal.Desktop.csproj -c Release --no-restore

      - name: Publish single EXE
        run: dotnet publish desktop/Northfield.Fiscal.Desktop/Northfield.Fiscal.Desktop.csproj -c Release -r win-x64 --self-contained true --no-restore -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:PublishTrimmed=false -o artifacts/Northfield-Fiscal-win-x64

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: Northfield-Fiscal-win-x64
          path: artifacts/Northfield-Fiscal-win-x64/**
          if-no-files-found: error
